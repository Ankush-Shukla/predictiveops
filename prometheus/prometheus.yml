global:
  # Accelerated demo: the demo target advances one simulated minute every 5 s and the API samples
  # Prometheus every 5 s. Scraping faster than that (2 s) means each 5 s step sees a fresh value.
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: [ "node-exporter:9100" ]

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: [ "cadvisor:8080" ]

  - job_name: demo-app
    metrics_path: /metrics
    static_configs:
      - targets: [ "demo-app:8001" ]
        labels:
          service: demo-app

  - job_name: demo-app-canary       # only up when started with: docker compose --profile canary up
    static_configs:
      - targets: [ "demo-app-canary:8002" ]
        labels:
          service: demo-app-canary

  - job_name: predictiveops-api
    static_configs:
      - targets: [ "api:8000" ]
