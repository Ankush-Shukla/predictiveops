global:
  # Production scrape cadence. The model ingestion path samples complete one-minute windows.
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: node-exporter
    scrape_interval: 15s
    static_configs:
      - targets: [ "node-exporter:9100" ]

  - job_name: cadvisor
    scrape_interval: 15s
    static_configs:
      - targets: [ "cadvisor:8080" ]

  - job_name: predictiveops-api
    static_configs:
      - targets: [ "api:8000" ]
