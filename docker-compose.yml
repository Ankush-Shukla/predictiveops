# PredictiveOps production telemetry and prediction stack.
# Required: GRAFANA_ADMIN_PASSWORD. Optional: PREDICTIVEOPS_API_KEY and application target configuration.
name: predictiveops

x-app-env: &app-env
  PREDICTIVEOPS_MODEL_DIR: /srv/artifacts/models
  PREDICTIVEOPS_SQLITE_PATH: /srv/artifacts/predictiveops.sqlite
  PREDICTIVEOPS_MLFLOW_TRACKING_URI: sqlite:////srv/artifacts/mlflow.db
  PREDICTIVEOPS_DATA_DIR: /srv/artifacts/data

services:
  trainer:
    profiles: [ "training" ]
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: predictiveops-trainer:local
    environment: *app-env
    command:
      - sh
      - -c
      - >-
        python scripts/train.py --data /srv/training-data/host.csv.gz --scope host
        --model-root /srv/artifacts/models/host --promote --enforce-gates &&
        python scripts/train.py --data /srv/training-data/application.csv.gz --scope application
        --model-root /srv/artifacts/models/application --promote --enforce-gates
    volumes:
      - artifacts:/srv/artifacts
      - ./training-data:/srv/training-data:ro
    restart: "no"
  # Build supervised datasets from real telemetry and confirmed incident annotations.
  build-training-data:
    profiles: [ "training" ]
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: predictiveops-trainer:local
    environment: *app-env
    entrypoint: [ "python", "scripts/build_training_data.py" ]
    command: [ "--scope", "host" ]
    volumes:
      - artifacts:/srv/artifacts
      - ./training-data:/srv/training-data
    restart: "no"

  # Isolated synthetic model for the explicitly labelled dashboard demonstration.
  demo-model:
    profiles: [ "demo" ]
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: predictiveops-trainer:local
    environment: *app-env
    command:
      - sh
      - -c
      - >-
        python scripts/generate_data.py --days 14 --series 4 --seed 42 --out /tmp/synthetic.csv.gz &&
        python scripts/train.py --data /tmp/synthetic.csv.gz --scope combined
        --model-root /srv/artifacts/models --no-mlflow --promote
    volumes: [ "artifacts:/srv/artifacts" ]
    restart: "no"

  api:
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    image: predictiveops-runtime:local
    environment:
      <<: *app-env
      PREDICTIVEOPS_ENV: production
      PREDICTIVEOPS_PROMETHEUS_ENABLED: "true"
      PREDICTIVEOPS_PROMETHEUS_URL: http://prometheus:9090
      PREDICTIVEOPS_PROMETHEUS_HOST_SERIES_ID: ${PREDICTIVEOPS_PROMETHEUS_HOST_SERIES_ID:-home-server}
      PREDICTIVEOPS_PROMETHEUS_APPLICATION_SERVICES: ${PREDICTIVEOPS_PROMETHEUS_APPLICATION_SERVICES:-}
      PREDICTIVEOPS_MANAGED_CONTAINER_NAMES: ${PREDICTIVEOPS_MANAGED_CONTAINER_NAMES:-}
      PREDICTIVEOPS_PROMETHEUS_STEP_SECONDS: "60"  # one real minute per model sample
      PREDICTIVEOPS_PROMETHEUS_POLL_SECONDS: "60"
      PREDICTIVEOPS_API_KEY: ${PREDICTIVEOPS_API_KEY:-}
      PREDICTIVEOPS_REMEDIATION_ENABLED: ${PREDICTIVEOPS_REMEDIATION_ENABLED:-false}
      PREDICTIVEOPS_DRY_RUN: ${PREDICTIVEOPS_DRY_RUN:-true}
      PREDICTIVEOPS_REMEDIATION_TARGETS: '{}'
      PREDICTIVEOPS_LOAD_GENERATOR_TOKEN: ${PREDICTIVEOPS_LOAD_GENERATOR_TOKEN:?set PREDICTIVEOPS_LOAD_GENERATOR_TOKEN in .env}
    volumes:
      - artifacts:/srv/artifacts
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    restart: unless-stopped

  load-generator:
    build: { context: ., dockerfile: docker/Dockerfile, target: runtime }
    image: predictiveops-runtime:local
    command: ["uvicorn", "app.services.load_generator:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      PREDICTIVEOPS_LOAD_GENERATOR_TOKEN: ${PREDICTIVEOPS_LOAD_GENERATOR_TOKEN:?set PREDICTIVEOPS_LOAD_GENERATOR_TOKEN in .env}
    expose: ["8001"]
    read_only: true
    tmpfs: ["/tmp:size=16m,noexec,nosuid"]
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
          pids: 64
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build: { context: ./frontend, dockerfile: Dockerfile }
    image: predictiveops-frontend:local
    depends_on: [ api ]
    ports: [ "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:8000:80" ]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports: [ "127.0.0.1:9091:9090" ]
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: predictiveops-cadvisor
    command: [ "--docker_only=true", "--housekeeping_interval=15s" ]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.rootfs=/host
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --web.listen-address=:9100
    expose: ["9100"]
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    depends_on: [ prometheus ]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: [ "${TAILSCALE_IP:?set TAILSCALE_IP in .env}:3000:3000" ]
    restart: unless-stopped

  mlflow:
    profiles: [ "mlflow" ]
    build: { context: ., dockerfile: docker/Dockerfile, target: trainer }
    image: predictiveops-trainer:local
    command: [ "mlflow", "ui", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////srv/artifacts/mlflow.db" ]
    volumes: [ "artifacts:/srv/artifacts" ]
    ports: [ "127.0.0.1:5000:5000" ]

volumes:
  artifacts:
  prometheus-data:
  grafana-data:
