name: ci
on:
  push:
    branches: [ main ]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -o addopts="" -q --cov=app --cov=data --cov=training --cov-report=term-missing

  validate-infra:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compose file is valid (placeholder, non-secret value for the required variable)
        run: TAILSCALE_IP=127.0.0.1 GRAFANA_ADMIN_PASSWORD=ci-placeholder docker compose config --quiet
      - name: Prometheus config and rules are valid
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/prometheus:/p:ro" -v "$PWD/monitoring:/m:ro" \
            prom/prometheus:v3.5.0 check rules /m/alert_rules.yml
          docker run --rm --entrypoint sh -v "$PWD/prometheus:/p:ro" -v "$PWD/monitoring:/m:ro" \
            prom/prometheus:v3.5.0 -c "sed 's/\\${TAILSCALE_IP}/127.0.0.1/g' /p/prometheus.yml > /tmp/prometheus.yml && mkdir -p /etc/prometheus && cp /m/alert_rules.yml /etc/prometheus/ && promtool check config /tmp/prometheus.yml"
      - name: Images build
        run: |
          docker build -f docker/Dockerfile --target runtime -t predictiveops-runtime:ci .
          docker build -f docker/Dockerfile --target trainer -t predictiveops-trainer:ci .
      - name: Dockerfile lint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile
