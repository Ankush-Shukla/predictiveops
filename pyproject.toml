[project]
name = "predictiveops"
version = "0.1.0"
description = "Predictive failure detection and ML-driven deployment validation for containerized applications"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "joblib>=1.3",
    "mlflow>=2.14",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prometheus-client>=0.20",
    "docker>=7.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "data*", "training*", "demo_app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: runs real Prometheus/node_exporter/uvicorn processes (needs PROMETHEUS_BIN)"]

[tool.ruff]
line-length = 110
extend-exclude = ["mlruns", "artifacts"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]
