# Production telemetry alerts. Durations are based on real scrape time.
groups:
  - name: predictiveops
    rules:
      - alert: PredictedFailure
        expr: predictiveops_predicted_failure == 1
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "Model predicts failure for {{ $labels.series_id }}"
      - alert: PolicyAlertLevel
        expr: predictiveops_policy_level >= 2
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Sustained failure risk for {{ $labels.series_id }} (policy level {{ $value }})"
      - alert: PredictiveOpsModelMissing
        expr: absent(predictiveops_model_info)
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PredictiveOps API reports no loaded model"
      - alert: PredictiveOpsSourceMissing
        expr: up{job=~"node-exporter|cadvisor"} == 0
        for: 2m
        labels: { severity: critical, scope: host }
        annotations:
          summary: "A host telemetry exporter is unavailable: {{ $labels.job }}"

  - name: host-safety-net
    rules:
      - alert: HostCpuWarning
        expr: 100 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100 > 80
        for: 5m
        labels: { severity: warning, source: static-threshold, scope: host }
        annotations:
          summary: "Host CPU utilization above 80% on {{ $labels.instance }}"
      - alert: HostMemoryWarning
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 85
        for: 5m
        labels: { severity: warning, source: static-threshold, scope: host }
        annotations:
          summary: "Host memory utilization above 85% on {{ $labels.instance }}"
      - alert: HostFilesystemWarning
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) > 85
        for: 5m
        labels: { severity: warning, source: static-threshold, scope: host }
        annotations:
          summary: "Root filesystem usage above 85% on {{ $labels.instance }}"
      - alert: HostDiskIoWarning
        expr: max by (instance, device) (rate(node_disk_io_time_seconds_total[5m])) * 100 > 85
        for: 5m
        labels: { severity: warning, source: static-threshold, scope: host }
        annotations:
          summary: "Disk utilization above 85% on {{ $labels.instance }} / {{ $labels.device }}"
