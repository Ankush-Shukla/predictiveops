# Visible in the Prometheus UI (no Alertmanager in this prototype). Durations assume the accelerated demo.
groups:
  - name: predictiveops
    rules:
      - alert: PredictedFailure
        expr: predictiveops_predicted_failure == 1
        for: 15s
        labels: { severity: warning }
        annotations:
          summary: "Model predicts failure for {{ $labels.series_id }}"
      - alert: PolicyAlertLevel
        expr: predictiveops_policy_level >= 2
        labels: { severity: critical }
        annotations:
          summary: "Sustained failure risk for {{ $labels.series_id }} (policy level {{ $value }})"
      - alert: PredictiveOpsModelMissing
        expr: absent(predictiveops_model_info)
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "PredictiveOps API reports no loaded model"
      - alert: DemoAppDown
        expr: up{job="demo-app"} == 0
        for: 30s
        labels: { severity: critical }
        annotations:
          summary: "demo-app is not being scraped"

  # Static-threshold SAFETY NET. The model only recognises fault mechanisms it was trained on (see
  # docs/evaluation.md: held-out mechanisms were mostly missed), whereas plain warning thresholds still
  # fire for them. Thresholds mirror training/baseline.py (a test keeps them in sync).
  - name: static-safety-net
    rules:
      - alert: StaticCpuWarning
        expr: demo_cpu_pct > 80
        for: 15s
        labels: { severity: warning, source: static-threshold }
        annotations: { summary: "CPU above 80 % on {{ $labels.service }}" }
      - alert: StaticMemoryWarning
        expr: demo_memory_pct > 85
        for: 15s
        labels: { severity: warning, source: static-threshold }
        annotations: { summary: "Memory above 85 % on {{ $labels.service }}" }
      - alert: StaticDiskIoWarning
        expr: demo_disk_io_util_pct > 85
        for: 15s
        labels: { severity: warning, source: static-threshold }
        annotations: { summary: "Disk I/O above 85 % on {{ $labels.service }}" }
      - alert: StaticLatencyWarning
        expr: demo_latency_p95_ms > 500
        for: 15s
        labels: { severity: warning, source: static-threshold }
        annotations: { summary: "p95 latency above 500 ms on {{ $labels.service }}" }
      - alert: StaticErrorRateWarning
        expr: demo_error_rate > 0.02
        for: 15s
        labels: { severity: warning, source: static-threshold }
        annotations: { summary: "Error rate above 2 % on {{ $labels.service }}" }
